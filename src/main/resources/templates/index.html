<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Agent Manager</title>
    <meta charset="UTF-8">
    <style>
        body {
            margin: 0;
            font-family: 'Segoe UI', Arial;
            background: linear-gradient(135deg,#0f172a,#020617);
            color: white;
        }

        header {
            background: rgba(0,0,0,0.3);
            padding: 20px 40px;
            font-size: 28px;
            font-weight: bold;
        }

        .container {
            text-align: center;
            padding-top: 120px;
        }

        h1 {
            font-size: 52px;
            margin-bottom: 20px;
        }

        .btn {
            background: #22c55e;
            padding: 14px 28px;
            border-radius: 10px;
            color: white;
            text-decoration: none;
            font-size: 18px;
            transition: 0.3s;
        }

        .btn:hover {
            background: #16a34a;
        }
    </style>
</head>

<body>
<header>Agent Manager</header>

<div class="container">
    <h1>Welcome to Agent Manager</h1>
    <p>Manage Valorant agents with Spring Boot</p>
    <br>
    <a href="/agents-page" class="btn">View Agents</a>
</div>

</body>
</html>
