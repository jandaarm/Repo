<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Edit Agent</title>
    <meta charset="UTF-8">
    <style>
        body {
            background:#0f172a;
            color:white;
            font-family:Arial;
            padding:40px;
        }
        input {
            display:block;
            margin:10px 0;
            padding:10px;
            width:250px;
            border-radius:6px;
            border:none;
        }
        button {
            padding:10px 20px;
            background:#3b82f6;
            border:none;
            border-radius:8px;
            color:white;
            cursor:pointer;
        }
    </style>
</head>

<body>

<h1>Edit Agent</h1>

<form th:action="@{'/edit-agent/' + ${agent.id}}" method="post">
    <input name="name" th:value="${agent.name}" />
    <input name="role" th:value="${agent.role}" />
    <input name="q" th:value="${agent.q}" />
    <input name="e" th:value="${agent.e}" />
    <input name="c" th:value="${agent.c}" />
    <input name="x" th:value="${agent.x}" />
    <button type="submit">Update</button>
</form>

</body>
</html>
