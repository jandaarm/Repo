<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Add Agent</title>
    <meta charset="UTF-8">
    <style>
        body {
            background:#0f172a;
            color:white;
            font-family:Arial;
            padding:40px;
        }

        input {
            display:block;
            margin:10px 0;
            padding:10px;
            width:250px;
            border-radius:6px;
            border:none;
        }

        button {
            padding:10px 20px;
            background:#22c55e;
            border:none;
            border-radius:8px;
            color:white;
            cursor:pointer;
        }
    </style>
</head>

<body>

<h1>Add New Agent</h1>

<form action="/add-agent" method="post">
    <input name="name" placeholder="Name"/>
    <input name="role" placeholder="Role"/>
    <input name="q" placeholder="Ability Q"/>
    <input name="e" placeholder="Ability E"/>
    <input name="c" placeholder="Ability C"/>
    <input name="x" placeholder="Ultimate"/>
    <button type="submit">Create</button>
</form>

</body>
</html>
